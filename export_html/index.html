    <!-- Konten Formulir Edit Profil -->
    <div class="flex-1 overflow-y-auto px-6 pt-2 pb-6 space-y-4">
      
      <!-- Display Name Underline -->
      <div class="flex flex-col items-center justify-center mb-2">
        <div class="flex items-center gap-2 border-b-2 border-[#2C7769] pb-1">
          <span class="text-2xl font-bold text-[#165540]">Alexumber</span>
          <svg class="w-5 h-5 text-[#165540]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>

      <!-- Field 1: Username -->
      <div>
        <label class="block text-sm font-bold text-[#165540] mb-1.5">Username</label>
        <div class="h-11 bg-[#E5EFE2] border border-[#165540] rounded-none px-3.5 flex items-center justify-between">
          <input type="text" value="@acumber" class="bg-transparent text-sm font-medium text-[#165540] outline-none w-full">
          <svg class="w-4 h-4 text-[#165540]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>

      <!-- Field 2: Biografi -->
      <div>
        <label class="block text-sm font-bold text-[#165540] mb-1.5">Biografi</label>
        <div class="h-11 bg-[#E5EFE2] border border-[#165540] rounded-none px-3.5 flex items-center justify-between">
          <input type="text" value="hi" class="bg-transparent text-sm font-medium text-[#165540] outline-none w-full">
          <svg class="w-4 h-4 text-[#165540]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>

      <!-- Field 3: Email (BARU) -->
      <div>
        <label class="block text-sm font-bold text-[#165540] mb-1.5">Email</label>
        <div class="h-11 bg-[#E5EFE2] border border-[#165540] rounded-none px-3.5 flex items-center justify-between">
          <input type="email" value="alexumber@gmail.com" class="bg-transparent text-sm font-medium text-[#165540] outline-none w-full">
          <svg class="w-4 h-4 text-[#165540]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>

      <!-- Field 4: Alamat (BARU) -->
      <div>
        <label class="block text-sm font-bold text-[#165540] mb-1.5">Alamat</label>
        <div class="h-11 bg-[#E5EFE2] border border-[#165540] rounded-none px-3.5 flex items-center justify-between">
          <input type="text" value="Jakarta, Indonesia" class="bg-transparent text-sm font-medium text-[#165540] outline-none w-full">
          <svg class="w-4 h-4 text-[#165540]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
      </div>

      <!-- Tombol Simpan Perubahan -->
      <div class="pt-4 flex justify-center">
        <button class="bg-[#165540] text-white px-8 py-2.5 rounded-none font-bold text-sm tracking-wide shadow-md hover:bg-[#124231] transition">
          Simpan Perubahan
        </button>
      </div>

    </div>
